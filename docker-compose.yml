name: email-ops-agent

services:
  app-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${APP_DB_USER}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD}
      POSTGRES_DB: ${APP_DB_NAME}
    volumes:
      - app_db_data:/var/lib/postgresql/data
    ports:
      - "${APP_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_DB_USER} -d ${APP_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8082}:8080"
    depends_on:
      - app-db

  email-simulator:
    build: ./email-simulator
    restart: unless-stopped
    ports:
      - "${EMAIL_SIM_PORT:-8001}:8001"
    volumes:
      - ./email-simulator/src/email_simulator/fixtures:/app/fixtures:ro

  # ---- Optional: read a real mailbox over IMAP instead of the simulator ----
  # Opt-in (`docker compose --profile imap up -d`) so the default stack is
  # unchanged. imap-bridge serves the same GET /messages contract as the
  # simulator, read-only; greenmail is a throwaway local IMAP/SMTP server for
  # trying it without a real mailbox. To use a real mailbox, set IMAP_HOST /
  # IMAP_USER / IMAP_PASSWORD (and IMAP_SSL=true, IMAP_PORT=993) in .env and
  # skip greenmail. Both publish on 127.0.0.1 only: the bridge serves mail
  # content without a login, so it must not be reachable from the network.
  greenmail:
    image: greenmail/standalone:2.1.3
    profiles: ["imap"]
    restart: unless-stopped
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=${IMAP_USER:-demo}:${IMAP_PASSWORD:-demo-password}@demo-company.test
    ports:
      - "127.0.0.1:${GREENMAIL_SMTP_PORT:-3025}:3025"
      - "127.0.0.1:${GREENMAIL_IMAP_PORT:-3143}:3143"

  imap-bridge:
    build: ./imap-bridge
    profiles: ["imap"]
    restart: unless-stopped
    environment:
      IMAP_HOST: ${IMAP_HOST:-greenmail}
      IMAP_PORT: ${IMAP_PORT:-3143}
      IMAP_SSL: ${IMAP_SSL:-false}
      IMAP_USER: ${IMAP_USER:-demo}
      IMAP_PASSWORD: ${IMAP_PASSWORD:-}
      IMAP_FOLDER: ${IMAP_FOLDER:-INBOX}
      IMAP_LOOKBACK_DAYS: ${IMAP_LOOKBACK_DAYS:-14}
      IMAP_MAX_MESSAGES: ${IMAP_MAX_MESSAGES:-200}
    ports:
      - "127.0.0.1:${IMAP_BRIDGE_PORT:-8002}:8002"

  app:
    build: ./app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${APP_DB_USER}:${APP_DB_PASSWORD}@app-db:5432/${APP_DB_NAME}
      # Where emails come from: the simulator by default. To read a real (or
      # sandbox) mailbox instead, start the `imap` profile and set
      # EMAIL_SOURCE_URL=http://imap-bridge:8002 in .env; see README.
      EMAIL_SIMULATOR_URL: ${EMAIL_SOURCE_URL:-http://email-simulator:8001}
      ESPOCRM_BASE_URL: http://espocrm:80
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-mistral:7b-instruct}
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      app-db:
        condition: service_healthy
      email-simulator:
        condition: service_started
      ollama:
        condition: service_started

  # Self-hosted, open-weight LLM for classify/extract — keeps inbound
  # email content off any third-party API, which is the point for
  # clients under EU data-residency constraints. Swappable for Claude
  # via LLM_PROVIDER for POCs that don't have that constraint; see
  # app/src/app/llm/.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      # Ollama's default is to unload an idle model after 5 minutes, and a
      # cold load of a 7B model takes minutes on CPU. Keep it resident.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-24h}
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Runs on CPU by default, which is fine for a 7B model at demo
    # scale (just slower). For a real deployment, uncomment to pass
    # through an NVIDIA GPU (requires the NVIDIA Container Toolkit
    # on the host):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # One-shot: pulls the model into ollama's volume on first run, then
  # exits. Re-running docker compose up is a no-op once the model is
  # cached (Ollama skips the pull if it's already present).
  ollama-pull:
    image: curlimages/curl:latest
    restart: "no"
    depends_on:
      - ollama
    entrypoint: ["/bin/sh", "-c"]
    # A single list item so the whole script is one argv element for
    # `-c` — a plain (non-list) command would get re-split on
    # whitespace by Compose and break the sh -c invocation.
    command:
      - >-
        until curl -sf http://ollama:11434/api/tags >/dev/null; do sleep 2; done;
        curl -s http://ollama:11434/api/pull -d '{"model":"${OLLAMA_MODEL:-mistral:7b-instruct}"}'

  # One-shot: loads the model into memory once it has been pulled, so the
  # slow cold load happens during `docker compose up` instead of on the
  # first email. The request has to stay open until the load finishes (the
  # app's own timeout would abort it), hence the long --max-time. Watch for
  # it finishing with GET /ready on the app, which reports llm.ready.
  ollama-warm:
    image: curlimages/curl:latest
    restart: "no"
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        curl -s --max-time 7200 http://ollama:11434/api/generate
        -d '{"model":"${OLLAMA_MODEL:-mistral:7b-instruct}","prompt":"hi","stream":false,"keep_alive":"${OLLAMA_KEEP_ALIVE:-24h}"}'

  espocrm-db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${ESPOCRM_DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${ESPOCRM_DB_NAME}
      MARIADB_USER: ${ESPOCRM_DB_USER}
      MARIADB_PASSWORD: ${ESPOCRM_DB_PASSWORD}
    volumes:
      - espocrm_db_data:/var/lib/mysql

  espocrm:
    image: espocrm/espocrm:latest
    restart: unless-stopped
    environment:
      ESPOCRM_DATABASE_HOST: espocrm-db
      ESPOCRM_DATABASE_USER: ${ESPOCRM_DB_USER}
      ESPOCRM_DATABASE_PASSWORD: ${ESPOCRM_DB_PASSWORD}
      ESPOCRM_ADMIN_USERNAME: ${ESPOCRM_ADMIN_USERNAME}
      ESPOCRM_ADMIN_PASSWORD: ${ESPOCRM_ADMIN_PASSWORD}
      ESPOCRM_SITE_URL: ${ESPOCRM_SITE_URL}
    volumes:
      - espocrm_data:/var/www/html/data
      - espocrm_custom:/var/www/html/custom
    ports:
      - "${ESPOCRM_PORT:-8080}:80"
    depends_on:
      - espocrm-db

  # Runs EspoCRM's scheduled jobs (workflows, notifications). Not required
  # for the Phase 1 demo loop, but cheap to include so the CRM behaves
  # normally if you poke around in it manually. There's no separate
  # "espocrm-daemon" image — EspoCRM's own docs run the same espocrm
  # image with a different entrypoint script for the cron/daemon process.
  espocrm-daemon:
    image: espocrm/espocrm:latest
    entrypoint: docker-daemon.sh
    restart: unless-stopped
    environment:
      ESPOCRM_DATABASE_HOST: espocrm-db
      ESPOCRM_DATABASE_USER: ${ESPOCRM_DB_USER}
      ESPOCRM_DATABASE_PASSWORD: ${ESPOCRM_DB_PASSWORD}
    volumes:
      - espocrm_data:/var/www/html/data
      - espocrm_custom:/var/www/html/custom
    depends_on:
      - espocrm-db

volumes:
  app_db_data:
  espocrm_db_data:
  espocrm_data:
  espocrm_custom:
  ollama_data:
